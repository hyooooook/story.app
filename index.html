<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>物語と風景</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="物語と風景">
<meta name="theme-color" content="#e6e2d9">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232a2926'/%3E%3Ctext x='50' y='64' font-size='54' text-anchor='middle'%3E%F0%9F%93%B7%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e2d9;--paper:#f2f0ea;--ink:#2a2926;--sub:#6f6b63;--line:#c9c4b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--paper:#222325;--ink:#e8e4da;--sub:#9a968c;--line:#3a3b3e}}
:root[data-theme="dark"]{--bg:#17181a;--paper:#222325;--ink:#e8e4da;--sub:#9a968c;--line:#3a3b3e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;display:flex;justify-content:center;padding:24px 16px 40px}
main{width:100%;max-width:360px}
section{display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:20px;font-weight:500;letter-spacing:.06em}
p{margin:0;line-height:1.8}
.sub{font-size:13px;color:var(--sub)}
.read p{font-size:17px;line-height:2.1;margin:0 0 1em;letter-spacing:.04em}
.chips{display:flex;gap:8px}
.btn,.chip{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:11px 14px;border-radius:2px;text-align:center;cursor:pointer;display:block}
.chip{flex:1}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35}
.btn.ghost{border-color:var(--line);color:var(--sub)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
#card,#vimg{width:100%;display:block;border:1px solid var(--line);border-radius:4px}
#sel{font-size:15px;line-height:2;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
#sel p{margin:0 0 .6em}
mark{background:transparent;color:inherit;text-decoration:underline;text-underline-offset:5px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--sub)}
.field input{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 2px;border-radius:0}
#gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--line);border-radius:2px;cursor:pointer}
.cond{font-size:13px;color:var(--sub)}
.linklike{background:none;border:none;color:var(--sub);text-decoration:underline;font-size:13px;padding:4px 0;cursor:pointer;font-family:inherit;align-self:flex-start}
</style>
</head>
<body>
<main>
<section id="s1">
  <h1>物語と風景</h1>
  <p class="sub">いまの天気に合わせて、物語をもらいます。文章に合う場所を探しに、外へ出てみましょう。</p>
  <p class="cond" id="cond">現在地の天気を取得しています…</p>
  <div class="chips" id="chips">
    <button class="chip" data-w="晴れ" aria-pressed="false">晴れ</button>
    <button class="chip" data-w="曇り" aria-pressed="false">曇り</button>
    <button class="chip" data-w="雨" aria-pressed="false">雨</button>
  </div>
  <button class="linklike" id="retry" hidden>もう一度、現在地の天気を取得する</button>
  <button class="btn" id="go">物語をもらう</button>
  <p class="sub" id="galh" hidden>これまでの作品</p>
  <div id="gal"></div>
</section>

<section id="s2" hidden>
  <div class="read" id="read"></div>
  <label class="btn">写真を撮る、または選ぶ<input class="vh" id="file" type="file" accept="image/*"></label>
  <button class="btn ghost" id="back2">はじめに戻る</button>
</section>

<section id="s3" hidden>
  <img id="card" alt="作品カードのプレビュー">
  <p class="sub">本文の一部を長押しして選ぶと、その言葉が見出しになります。</p>
  <div id="sel"></div>
  <button class="btn" id="pick" disabled>選んだ言葉を見出しにする</button>
  <div class="field">
    <label for="place">撮影場所(任意)</label>
    <input id="place" type="text" placeholder="例: 駅前の商店街" autocomplete="off">
  </div>
  <button class="btn" id="save">作品を保存する</button>
  <p class="sub" id="msg" aria-live="polite"></p>
  <button class="btn ghost" id="back3">はじめに戻る</button>
</section>

<section id="s4" hidden>
  <img id="vimg" alt="保存した作品">
  <p class="sub">画像を長押しすると、端末に保存できます。</p>
  <button class="btn ghost" id="back4">戻る</button>
</section>
</main>
<canvas id="cv" hidden></canvas>
<script>
var $=function(i){return document.getElementById(i)};
var STOCK={
"晴れ":["朝の光が、まだ低いところから差していた。","いつもの道なのに、影がやけに長い。電柱の影が、道の向こうまで手を伸ばしている。","どこかの窓が開いて、味噌汁の匂いが流れてきた。自転車のベルが一度だけ鳴って、遠ざかる。","光の中を、白い息がゆっくり上っていった。","金網の角に、朝露がひとつ残っていた。私はしばらく、それが落ちるのを待った。","落ちなかった。それでよかった気がした。"],
"曇り":["雲が低くて、空がふたのようだった。","帰り道、角の自動販売機だけが白く光っていて、その周りだけ夜が薄い。缶が落ちる鈍い音がして、誰かの手が湯気を包んだ。","遠くで電車が通る。冷たい空気に、焼き芋の甘い匂いが少しだけ混ざっていた。","濡れたアスファルトに、光がにじんでいる。歩くたび、その光が靴の先にくっついてきた。","どこにも寄らず、ただ、もう少しだけ遠回りをした。"],
"雨":["傘を閉じたのは、雨が上がったからではなかった。ただ、音がやんだ気がしたのだ。","軒先から、水滴が一定の間隔で落ちている。その下の小さな水たまりに、看板の赤がゆれていた。","湿った土の匂い。どこかで、雨戸を閉める音がした。","猫が一匹、水たまりを避けて、器用に道を渡っていった。","私は傘を持ったまま、そこに立っていた。急ぐ理由が、ひとつずつ消えていくようだった。"]};
var F='"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif';
var W='晴れ',photo=null,paras=[],head='',picked='',when='';

function timeBucket(h){if(h>=5&&h<9)return'朝';if(h>=9&&h<16)return'昼';if(h>=16&&h<19)return'夕方';return'夜'}
function season(m){if(m>=3&&m<=5)return'春';if(m>=6&&m<=8)return'夏';if(m>=9&&m<=11)return'秋';return'冬'}
function nowCond(){var d=new Date();return{t:timeBucket(d.getHours()),s:season(d.getMonth()+1)}}

// ---- 天気(Open-Meteo、キー不要、現在地から取得) ----
function weatherCategory(code){
  if(code===0||code===1||code===2)return'晴れ';
  if(code===3||code===45||code===48||(code>=71&&code<=77)||(code>=85&&code<=86))return'曇り';
  return'雨';
}
function weatherLabel(code){
  if(code===0)return'快晴';if(code===1)return'ほぼ晴れ';if(code===2)return'晴れ時々曇り';
  if(code===3)return'曇り';if(code===45||code===48)return'霧';
  if(code>=51&&code<=57)return'霧雨';if(code>=61&&code<=67)return'雨';
  if(code>=71&&code<=77)return'雪';if(code>=80&&code<=82)return'にわか雨';
  if(code>=85&&code<=86)return'にわか雪';if(code>=95)return'雷雨';return'不明'}
function setChip(w){W=w;document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.w===w)})}
function fetchWeather(){
  $('cond').textContent='現在地の天気を取得しています…';$('retry').hidden=true;
  if(!navigator.geolocation){$('cond').textContent='この端末では位置情報が使えません。下から天気を選んでください。';setChip('晴れ');$('retry').hidden=true;return}
  navigator.geolocation.getCurrentPosition(async function(pos){
    try{
      var lat=pos.coords.latitude,lng=pos.coords.longitude;
      var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lng+'&current=temperature_2m,weather_code&timezone=auto';
      var res=await fetch(url);
      if(!res.ok)throw new Error('bad response');
      var data=await res.json();
      var code=data.current.weather_code;
      setChip(weatherCategory(code));
      $('cond').textContent='いまの天気: '+weatherLabel(code)+'('+Math.round(data.current.temperature_2m)+'℃)';
      $('retry').hidden=true;
    }catch(e){
      $('cond').textContent='天気の取得に失敗しました('+(e&&e.message?e.message:e)+')。下から選んでください。';setChip('晴れ');$('retry').hidden=false;
    }
  },function(err){
    $('cond').textContent='位置情報が許可されなかったため、下から天気を選んでください。';setChip('晴れ');$('retry').hidden=false;
  },{timeout:10000});
}
$('retry').onclick=fetchWeather;
fetchWeather();

function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]||c})}
function show(n){[1,2,3,4].forEach(function(i){$('s'+i).hidden=i!==n});window.scrollTo(0,0)}
function stamp(){var d=new Date(),z=function(v){return('0'+v).slice(-2)};return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+z(d.getHours())+':'+z(d.getMinutes())}
document.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){setChip(b.dataset.w)}});
function gal(){var a=[];try{a=JSON.parse(localStorage.getItem('works')||'[]')}catch(e){}
$('gal').innerHTML=a.map(function(s){return '<img src="'+s+'" alt="保存した作品">'}).join('');$('galh').hidden=!a.length}
$('gal').onclick=function(e){if(e.target.tagName==='IMG'){$('vimg').src=e.target.src;show(4)}};

var WORKER_URL='https://story.okzk-ryou.workers.dev/';
function stockStory(){paras=STOCK[W]||STOCK['晴れ'];head=paras[0].split('。')[0];
$('read').innerHTML=paras.map(function(p){return '<p>'+esc(p)+'</p>'}).join('');show(2)}
$('go').onclick=async function(){
  $('go').disabled=true;$('go').textContent='考え中…';
  var cond=nowCond();
  try{
    var res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({timeOfDay:cond.t,weather:W,season:cond.s})});
    var data=await res.json();
    if(!res.ok||!data.text)throw new Error('generation_failed');
    paras=data.text.split(/\n{2,}/).map(function(s){return s.trim()}).filter(Boolean);
    if(!paras.length)paras=[data.text.trim()];
    head=paras[0].split(/[。.]/)[0];
    $('read').innerHTML=paras.map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
    show(2);
  }catch(e){
    stockStory();
  }finally{$('go').disabled=false;$('go').textContent='物語をもらう'}
};

['back2','back3','back4'].forEach(function(i){$(i).onclick=function(){show(1)}});
$('file').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
r.onload=function(){var im=new Image();im.onload=function(){photo=im;when=stamp();$('msg').textContent='';buildSel();show(3);render()};im.src=r.result};r.readAsDataURL(f);e.target.value=''};
function buildSel(){var done=false;$('sel').innerHTML=paras.map(function(p){var i=p.indexOf(head);
if(!done&&i>-1){done=true;return '<p>'+esc(p.slice(0,i))+'<mark>'+esc(head)+'</mark>'+esc(p.slice(i+head.length))+'</p>'}
return '<p>'+esc(p)+'</p>'}).join('')}
document.addEventListener('selectionchange',function(){var s=getSelection(),t='',b=$('sel');
if(s&&s.rangeCount&&b.contains(s.anchorNode)&&b.contains(s.focusNode)){t=s.toString().trim().replace(/[。、]$/,'')}
picked=paras.some(function(p){return t&&p.indexOf(t)>-1})?t:'';$('pick').disabled=!picked});
$('pick').addEventListener('pointerdown',function(e){e.preventDefault()});
$('pick').onclick=function(){if(!picked)return;head=picked;getSelection().removeAllRanges();picked='';$('pick').disabled=true;buildSel();render()};
$('place').oninput=function(){render()};
function wrap(x,t,m){var L=[],c='';for(var ch of t){if(c&&x.measureText(c+ch).width>m){L.push(c);c=ch}else c+=ch}if(c)L.push(c);return L}
function font(x,wt,sz){x.font=wt+' '+sz+'px '+F;if('letterSpacing' in x)x.letterSpacing='1.5px';x.textAlign='left'}
async function render(){if(!photo)return;
try{await document.fonts.load('500 30px "Shippori Mincho"')}catch(e){}
var c=$('cv'),x=c.getContext('2d'),Wd=720,PH=828,pd=44;
font(x,400,30);var bl=paras.map(function(p){return wrap(x,p,Wd-pd*2)}),n=0;bl.forEach(function(l){n+=l.length});
var H=PH+40+n*60+bl.length*20+70;c.width=Wd;c.height=H;
x.fillStyle='#f2f0ea';x.fillRect(0,0,Wd,H);
x.save();x.beginPath();x.rect(0,0,Wd,PH);x.clip();
var k=Math.max(Wd/photo.width,PH/photo.height),w=photo.width*k,h=photo.height*k;x.drawImage(photo,(Wd-w)/2,(PH-h)/2,w,h);
var g=x.createLinearGradient(0,PH*.5,0,PH);g.addColorStop(0,'rgba(8,9,12,0)');g.addColorStop(1,'rgba(8,9,12,.8)');x.fillStyle=g;x.fillRect(0,PH*.5,Wd,PH*.5);x.restore();
font(x,500,40);x.fillStyle='#f3efe6';x.textBaseline='bottom';var tl=wrap(x,head,Wd-80);
tl.forEach(function(t,i){x.fillText(t,40,PH-36-(tl.length-1-i)*68)});
font(x,400,30);x.fillStyle='#2a2926';x.textBaseline='top';var y=PH+40;
bl.forEach(function(ls){ls.forEach(function(t){x.fillText(t,pd,y);y+=60});y+=20});
font(x,400,22);x.fillStyle='#6f6b63';x.textBaseline='bottom';x.fillText(when+' '+W,pd,H-30);
var pl=$('place').value.trim();if(pl){x.textAlign='right';x.fillText('📍 '+pl,Wd-pd,H-30)}
$('card').src=c.toDataURL('image/jpeg',.92)}
$('save').onclick=function(){try{var a=JSON.parse(localStorage.getItem('works')||'[]');
a.unshift($('cv').toDataURL('image/jpeg',.8));a=a.slice(0,8);localStorage.setItem('works',JSON.stringify(a));gal();
$('msg').textContent='保存しました。上の画像を長押しすると、端末にも保存できます。'}catch(e){$('msg').textContent='この端末では保存できませんでした。画像を長押しして保存してください。'}};
gal();
</script>
</body>
</html>
